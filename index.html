<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Clima</title>
  <link rel="stylesheet" href="style.css">
  <!-- Conexao com Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1>⛅ Painel do Clima</h1>

    <div class="busca-box">
      <input type="text" id="campo-busca" placeholder="Digite uma cidade (ex: São Paulo)">
      <button id="botao-buscar">Buscar</button>
    </div>

    <div id="resultado" class="card-resultado">
      <p>Digite o nome de uma cidade para ver a previsão.</p>
    </div>

    <div id="secao-favoritos" style="margin-top: 20px;">
      <h2>Meus Favoritos</h2>
      <button id="btn-favoritar" style="display: none; margin-bottom: 10px;">⭐ Favoritar esta cidade</button>
      <ul id="lista-favoritos"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
